<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>
  
  <!-- Fond circulaire émeraude/agriculture -->
  <rect width="100" height="100" rx="28" fill="url(#shieldGrad)" />
  
  <!-- Silhouette Bouclier / Protection -->
  <path d="M50 14 L80 26 C80 56 50 82 50 82 C50 82 20 56 20 26 Z" fill="#ffffff" opacity="0.15" />
  
  <!-- Silhouette Mouche stylisée / Cible Sentinel -->
  <!-- Ailes -->
  <ellipse cx="36" cy="46" rx="14" ry="7" transform="rotate(-35 36 46)" fill="#ffffff" opacity="0.85" />
  <ellipse cx="64" cy="46" rx="14" ry="7" transform="rotate(35 64 46)" fill="#ffffff" opacity="0.85" />
  
  <!-- Corps mouche -->
  <ellipse cx="50" cy="52" rx="7" ry="14" fill="#fbbf24" />
  <!-- Tête -->
  <circle cx="50" cy="35" r="7" fill="#f59e0b" />
  
  <!-- Yeux mouche -->
  <circle cx="46" cy="33" r="2.5" fill="#ef4444" />
  <circle cx="54" cy="33" r="2.5" fill="#ef4444" />
  
  <!-- Radar Sentinel / Cercle de détection -->
  <circle cx="50" cy="48" r="32" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 4" opacity="0.9" />
</svg>
